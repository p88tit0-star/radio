name: quran_radio
description: A vintage-style Islamic radio dedicated to live Quran recitation streams.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Audio playback
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # Networking (stream validation, HEAD checks)
  dio: ^5.5.0

  # Icons for the vintage UI (brass/knob glyphs) — no external image assets needed
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/stations.json
    - assets/audio/fatihah.mp3
    - assets/audio/ikhlas.mp3
    - assets/audio/falaq.mp3
    - assets/audio/nas.mp3
    - assets/audio/mulk.mp3
    - assets/audio/yasin.mp3
    - assets/audio/rahman.mp3
    - assets/images/
